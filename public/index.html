<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Панель управления Discord-ботом</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="login-screen" class="screen">
    <div class="card">
        <h1>🔐 Вход в панель</h1>
        <input id="password-input" type="password" placeholder="Пароль панели" />
        <button id="login-btn">Войти</button>
        <p id="login-error" class="error"></p>
    </div>
</div>

<div id="app-screen" class="screen hidden">
    <header>
        <h1>🎮 Панель управления ботом</h1>
        <span id="bot-status" class="status">…</span>
    </header>

    <main>
        <section class="card">
            <h2>Отправить сообщение на сервер</h2>
            <label>Сервер (guild)</label>
            <select id="guild-select"></select>

            <label>Канал</label>
            <select id="channel-select"></select>

            <label>Текст сообщения</label>
            <div class="toolbar" id="format-toolbar">
                <button type="button" data-fmt="bold" title="Жирный"><b>Ж</b></button>
                <button type="button" data-fmt="italic" title="Курсив"><i>К</i></button>
                <button type="button" data-fmt="underline" title="Подчёркнутый"><u>Ч</u></button>
                <button type="button" data-fmt="strike" title="Зачёркнутый"><s>З</s></button>
                <button type="button" data-fmt="spoiler" title="Скрытый текст (спойлер)">🙈 спойлер</button>
                <button type="button" data-fmt="code" title="Строчный код">`код`</button>
                <button type="button" data-fmt="codeblock" title="Блок кода">{ }</button>
                <button type="button" data-fmt="quote" title="Цитата">❝ цитата</button>
                <button type="button" data-fmt="h1" title="Заголовок">H1</button>
                <button type="button" data-fmt="h2" title="Подзаголовок">H2</button>
                <button type="button" data-fmt="h3" title="Мелкий заголовок">H3</button>
                <button type="button" data-fmt="list" title="Список">• список</button>
            </div>
            <textarea id="message-input" rows="4" placeholder="Текст сообщения... (можно оставить пустым, если используешь только Embed или кнопки)"></textarea>

            <div class="toggle-row">
                <label><input type="checkbox" id="embed-toggle" /> Добавить Embed-карточку</label>
            </div>

            <div id="embed-section" class="hidden subsection">
                <label>Заголовок</label>
                <input id="embed-title" type="text" maxlength="256" placeholder="Заголовок карточки" />

                <label>Описание</label>
                <textarea id="embed-description" rows="3" maxlength="4096" placeholder="Основной текст карточки"></textarea>

                <div class="row-2">
                    <div>
                        <label>Цвет полоски</label>
                        <input id="embed-color" type="color" value="#5865f2" />
                    </div>
                    <div>
                        <label>Ссылка на заголовке</label>
                        <input id="embed-url" type="text" placeholder="https://..." />
                    </div>
                </div>

                <label>Автор (текст сверху)</label>
                <input id="embed-author" type="text" maxlength="256" placeholder="Например: организатор турнира" />

                <div class="row-2">
                    <div>
                        <label>Картинка (URL)</label>
                        <input id="embed-image" type="text" placeholder="https://.../image.png" />
                    </div>
                    <div>
                        <label>Миниатюра (URL)</label>
                        <input id="embed-thumbnail" type="text" placeholder="https://.../thumb.png" />
                    </div>
                </div>

                <label>Футер (мелкий текст снизу)</label>
                <input id="embed-footer" type="text" maxlength="2048" placeholder="Например: Matcherino Tournament Bot" />

                <label class="checkbox-label">
                    <input type="checkbox" id="embed-timestamp" /> Добавить текущее время в футер
                </label>

                <label>Дополнительные поля</label>
                <div id="embed-fields"></div>
                <button type="button" id="add-field-btn" class="secondary-btn">+ Добавить поле</button>
            </div>

            <div class="toggle-row">
                <label><input type="checkbox" id="buttons-toggle" /> Добавить кнопки</label>
            </div>

            <div id="buttons-section" class="hidden subsection">
                <div id="button-list"></div>
                <button type="button" id="add-button-btn" class="secondary-btn">+ Добавить кнопку</button>
                <p class="hint">До 25 кнопок (автоматически разложатся по 5 в ряд). Кнопки типа «Ссылка» открывают URL напрямую; остальные при нажатии просто подтверждают клик — без своей логики.</p>
            </div>

            <button id="send-btn">Отправить</button>
            <p id="send-result" class="result"></p>
        </section>

        <!-- Блок ИИ-вопросов по турнирам временно убран, см. NOTES.md -->
    </main>

    <template id="field-template">
        <div class="field-item">
            <input type="text" class="field-name" maxlength="256" placeholder="Название поля" />
            <input type="text" class="field-value" maxlength="1024" placeholder="Значение" />
            <label class="inline-label"><input type="checkbox" class="field-inline" /> в строку</label>
            <button type="button" class="remove-btn" title="Удалить">✕</button>
        </div>
    </template>

    <template id="button-template">
        <div class="button-item">
            <input type="text" class="btn-label" maxlength="80" placeholder="Текст кнопки" />
            <select class="btn-style">
                <option value="primary">Синяя</option>
                <option value="secondary" selected>Серая</option>
                <option value="success">Зелёная</option>
                <option value="danger">Красная</option>
                <option value="link">Ссылка</option>
            </select>
            <input type="text" class="btn-url hidden" placeholder="https://... (для типа «Ссылка»)" />
            <button type="button" class="remove-btn" title="Удалить">✕</button>
        </div>
    </template>
</div>

<script src="panel.js"></script>
</body>
</html>
